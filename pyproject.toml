[project]
name = "google-cloud-support-mcp"
dynamic = ["version"]
description = "MCP server for Google Cloud Support - cases, comments, attachments, classifications across projects and organizations"
readme = "README.md"
authors = [
    { name = "hypn4", email = "khs951211@gmail.com" }
]
requires-python = ">=3.14"

# 헌법 원칙 IV: 정확한 값으로 고정. 2026-09-01 PyPI 확인 (T001).
# 전이 의존성(google-auth, pydantic, mcp, grpcio)은 직접 선언하지 않는다.
dependencies = [
    "fastmcp==4.0.0",
    "google-cloud-resource-manager==1.18.0",
    "google-cloud-support==0.5.3",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
]

[project.scripts]
google-cloud-support-mcp = "google_cloud_support_mcp:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.10",
]

[build-system]
# uv_build does not support `dynamic = ["version"]`, so the version comes from
# git tags via hatchling instead. The tag is the single source of truth: there
# is no version string in this file to drift out of sync with it.
#
# Pinned exactly so a release built today and one built next month produce the
# same artifact. Verified against PyPI 2026-09-01; uv-dynamic-versioning 0.14.1
# constrains hatchling to ~=1.28, which 1.32.0 satisfies.
requires = ["hatchling==1.32.0", "uv-dynamic-versioning==0.14.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/google_cloud_support_mcp"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
# Only reached when building outside a git checkout with no tag reachable.
# A release build must land on a tag exactly; anything else carries a PEP 440
# local segment (+abc1234) that PyPI refuses, which is the safety net.
fallback-version = "0.0.0"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
# ASYNC earns its place here: blocking file I/O inside an async def is invisible
# in review and in tests — nothing fails, the event loop just stalls while a
# 10 MB attachment moves, alongside the concurrent scope fan-out. A linter
# notices it every time; a reader does not.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test bodies assert against the filesystem on purpose. There is no loop to
# starve when the only other task is the test itself, and rewriting the
# assertions around thread hops would obscure what they check.
"tests/**" = ["ASYNC240"]

[tool.ruff.lint.isort]
known-first-party = ["google_cloud_support_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits the real Google Cloud Support API (requires GOOGLE_CLOUD_SUPPORT_MCP_IT_PARENT)",
]
addopts = "-m 'not integration'"
